name: Cleanup Preview

# Pull request close removes portfolio/pr-<N> and yt-scheduler/pr-<N>,
# plus the preview Worker, its D1 database, and its upload Workflow.
# Legacy branch-named folders stay until someone reviews the list from
# Actions → Cleanup Preview → Run workflow, then runs it again with
# confirm set to delete-legacy. That dispatch is the only purge; do not
# treat a green close as having removed the old slug folders.
on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Leave empty to list preview folders in the job summary. Type
          delete-legacy to delete legacy slug folders and pr-<N> folders
          whose PR is not open. Folders for open PRs are kept.
        required: false
        default: ""
        type: string

jobs:
  cleanup-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Same group as preview-deploy.yml (#95) so a close cancels an in-flight upload.
    # Job-level, not workflow-level: workflow_dispatch has no pull_request number.
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout cleanup script
        id: checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 requires Node >= 22. This job deletes the preview Worker.
          node-version: "22"

      - name: Delete portfolio/pr-<N>
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # *.hstgr.io cert vs the IP in FTP_HOST. Chain check stays on.
          FTP_TLS_CHECK_HOSTNAME: "no"
          PREVIEW_ROOT: ${{ secrets.FTP_TARGET_DIR_DEV_PREVIEW }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/preview-cleanup.sh delete-pr

      - name: Delete yt-scheduler/pr-<N>
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TLS_CHECK_HOSTNAME: "no"
          PREVIEW_ROOT: ${{ secrets.FTP_TARGET_DIR_DEV_PREVIEW }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_SLUG: yt-scheduler
        run: bash .github/scripts/preview-cleanup.sh delete-pr

      - name: Delete preview Worker, D1, and Workflow
        if: always() && steps.checkout.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node deploy/yt-worker.mjs delete-preview --pr "$PR_NUMBER"

  # Listing is the default. Deletion runs only when confirm is delete-legacy,
  # after the list has been reviewed in a previous job summary. FTP rm -r of
  # every preview since 2026-05 can outlive the 15 minute deploy timeout.
  purge-legacy-previews:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: preview-cleanup-legacy
      cancel-in-progress: false
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: List or delete legacy preview folders
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # *.hstgr.io cert vs the IP in FTP_HOST. Chain check stays on.
          FTP_TLS_CHECK_HOSTNAME: "no"
          PREVIEW_ROOT: ${{ secrets.FTP_TARGET_DIR_DEV_PREVIEW }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/preview-cleanup.sh purge
