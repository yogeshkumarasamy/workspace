name: Cleanup Preview on PR Close

on:
  pull_request:
    branches:
      - main
    types: [closed]

# Same group as preview-deploy.yml so closing the PR cancels an in-flight preview.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 🧼 Preview folder from PR number
        id: slug
        env:
          # Passed via env so the value is never interpolated into the script.
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Same folder as preview-deploy.yml: portfolio/pr-<N>. Digits only, so the name cannot be injected.
          case "$PR" in (''|*[!0-9]*) echo "::error::bad PR number"; exit 1;; esac
          echo "dir=pr-${PR}" >> "$GITHUB_OUTPUT"

      - name: 🧹 Delete preview folder via FTP using lftp
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_TARGET_DIR_DEV_PREVIEW: ${{ secrets.FTP_TARGET_DIR_DEV_PREVIEW }}
          PREVIEW_DIR: ${{ steps.slug.outputs.dir }}
        run: |
          # rm only ever sees pr-<digits>. A branch name cannot change this path.
          [[ "$PREVIEW_DIR" =~ ^pr-[0-9]+$ ]] || { echo "::error::refusing to delete '$PREVIEW_DIR'"; exit 1; }
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:list-options -a
          cd "$FTP_TARGET_DIR_DEV_PREVIEW"
          rm -r "portfolio/$PREVIEW_DIR"
          bye
          EOF
