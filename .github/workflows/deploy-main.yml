name: Deploy Vite App to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Never cancel an FTP upload that is already running.
    # GitHub drops any older pending run and keeps only the newest one.
    concurrency:
      group: deploy-dev-portfolio
      cancel-in-progress: false

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies with pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build Vite app
        run: pnpm --filter @apps/portfolio... build

      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/portfolio/dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR_DEV }}
