name: Deploy Vite App to Hostinger

# release/staging runs this file from the branch tip. It builds @apps/portfolio into FTP_TARGET_DIR_STAGING (#66).

on:
  push:
    branches:
      - release/staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Same rule as dev and production. Pushes to release/staging still run
    # the workflow copy on that branch until #66 resets it.
    concurrency:
      group: deploy-staging-portfolio
      cancel-in-progress: false

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies with pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build Vite app
        run: pnpm --filter @apps/portfolio... build

      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/portfolio/dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR_STAGING }}
