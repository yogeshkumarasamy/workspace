name: Preview Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  ctx:
    # Resolve the PR number from the workflow_run payload; skip forks; skip if base != main; skip unless conclusion == success
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      plan: ${{ steps.plan.outputs.plan }}
      should_deploy: ${{ steps.plan.outputs.should_deploy }}
    steps:
      - name: Resolve PR context
        id: resolve
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_JSON='${{ toJson(github.event.workflow_run.pull_requests) }}'
          PR_COUNT=$(echo "$PR_JSON" | jq 'length')

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No pull requests attached to workflow_run payload. Fetching from API..."
            RUN_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
            PR_JSON=$(echo "$RUN_DATA" | jq '.pull_requests')
            PR_COUNT=$(echo "$PR_JSON" | jq 'length')
          fi

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No pull request found for run ${RUN_ID}. Skipping."
            {
              echo "should_deploy=false"
              echo "pr="
              echo "sha="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
          IS_FORK=$(echo "$PR_JSON" | jq -r '.[0].head.repo.fork // false')
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.[0].head.repo.full_name // empty')
          BASE_REPO=$(echo "$PR_JSON" | jq -r '.[0].base.repo.full_name // empty')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.[0].base.ref')

          echo "PR Number: $PR_NUMBER"
          echo "Base Ref: $BASE_REF"
          echo "Is Fork: $IS_FORK (Head: $HEAD_REPO, Base: $BASE_REPO)"

          if [ "$IS_FORK" = "true" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Fork PRs get CI but no preview. Skipping."
            {
              echo "should_deploy=false"
              echo "pr=${PR_NUMBER}"
              echo "sha=${HEAD_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BASE_REF" != "main" ]; then
            echo "PR base is not main ($BASE_REF). Previews appear only for PRs whose base is main. Skipping."
            {
              echo "should_deploy=false"
              echo "pr=${PR_NUMBER}"
              echo "sha=${HEAD_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_deploy=true"
            echo "pr=${PR_NUMBER}"
            echo "sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Download CI artifact
        if: steps.resolve.outputs.should_deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ci-artifacts

      - name: Extract plan and unpack target dists
        if: steps.resolve.outputs.should_deploy == 'true'
        id: plan
        run: |
          set -euo pipefail

          PLAN_FILE=$(find ci-artifacts -name "plan.json" | head -n 1)
          if [ -z "$PLAN_FILE" ] || [ ! -f "$PLAN_FILE" ]; then
            echo "No plan.json found in artifacts. Skipping deploy."
            {
              echo "should_deploy=false"
              echo "plan=[]"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found plan file at $PLAN_FILE"
          cat "$PLAN_FILE"

          PR="${{ steps.resolve.outputs.pr }}"

          node -e '
            const fs = require("fs");
            const path = require("path");
            const planFile = process.argv[1];
            const pr = process.argv[2];
            const plan = JSON.parse(fs.readFileSync(planFile, "utf8"));

            const staticTargets = plan.filter(item => item.kind === "static" && item.env === "preview");

            const deployPlan = [];
            for (const item of staticTargets) {
              const target = item.target;
              const slug = item.target;

              let foundDist = null;
              function search(dir) {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) {
                    if (full.endsWith(path.join("apps", target, "dist"))) {
                      foundDist = full;
                      return;
                    }
                    search(full);
                    if (foundDist) return;
                  }
                }
              }
              search("ci-artifacts");

              if (foundDist) {
                const outDir = path.join("dist-packages", target);
                fs.mkdirSync(outDir, { recursive: true });
                fs.cpSync(foundDist, outDir, { recursive: true });
                deployPlan.push({
                  target: target,
                  slug: slug,
                  artifact: "preview-dist-" + target + "-pr-" + pr,
                  path: item.path,
                  base: item.path,
                  apiBaseUrl: item.apiBaseUrl || ""
                });
              }
            }

            fs.writeFileSync("filtered-plan.json", JSON.stringify(deployPlan));
            console.log("Filtered deploy plan:", JSON.stringify(deployPlan, null, 2));
          ' "$PLAN_FILE" "$PR"

          COUNT=$(jq 'length' filtered-plan.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "No static preview targets with dist found to deploy."
            {
              echo "should_deploy=false"
              echo "plan=[]"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_deploy=true"
              echo "plan=$(jq -c . filtered-plan.json)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload portfolio dist if built
        if: steps.plan.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist-portfolio-pr-${{ steps.resolve.outputs.pr }}
          path: dist-packages/portfolio
          if-no-files-found: ignore

      - name: Upload yt-scheduler dist if built
        if: steps.plan.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist-yt-scheduler-pr-${{ steps.resolve.outputs.pr }}
          path: dist-packages/yt-scheduler
          if-no-files-found: ignore

      - name: Upload ib-console dist if built
        if: steps.plan.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist-ib-console-pr-${{ steps.resolve.outputs.pr }}
          path: dist-packages/ib-console
          if-no-files-found: ignore

      - name: Upload ib dist if built
        if: steps.plan.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist-ib-pr-${{ steps.resolve.outputs.pr }}
          path: dist-packages/ib
          if-no-files-found: ignore

  deploy:
    needs: ctx
    if: needs.ctx.outputs.should_deploy == 'true'
    concurrency:
      group: preview-pr-${{ needs.ctx.outputs.pr }}
      cancel-in-progress: true
    strategy:
      matrix:
        include: ${{ fromJSON(needs.ctx.outputs.plan) }}
      max-parallel: 2
    uses: ./.github/workflows/deploy-static.yml
    with:
      env: preview
      target: ${{ matrix.target }}
      slug_dir: previews/${{ matrix.slug }}/pr-${{ needs.ctx.outputs.pr }}
      base: ${{ matrix.base }}
      sha: ${{ needs.ctx.outputs.sha }}
      artifact: ${{ matrix.artifact }}
      api_base_url: ${{ matrix.apiBaseUrl }}

  comment:
    needs: [ctx, deploy]
    if: always() && needs.ctx.outputs.should_deploy == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Format preview comment
        id: msg
        env:
          PLAN_JSON: ${{ needs.ctx.outputs.plan }}
          PR_NUMBER: ${{ needs.ctx.outputs.pr }}
          SHA: ${{ needs.ctx.outputs.sha }}
        run: |
          node -e '
            const plan = JSON.parse(process.env.PLAN_JSON || "[]");
            const pr = process.env.PR_NUMBER;
            const sha = process.env.SHA ? process.env.SHA.slice(0, 7) : "";
            const tick = String.fromCharCode(96);
            const lines = ["🚀 **Preview ready** for PR #" + pr + " (" + tick + sha + tick + "):\n"];
            for (const item of plan) {
              const url = "https://dev.yogeshkumarasamy.in" + item.path;
              lines.push("- **" + item.target + "**: [" + url + "](" + url + ")");
            }
            const body = lines.join("\n");
            const fs = require("fs");
            fs.writeFileSync("comment.md", body);
          '

      - name: Comment preview URLs on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ needs.ctx.outputs.pr }}
          header: preview-deploy
          path: comment.md
