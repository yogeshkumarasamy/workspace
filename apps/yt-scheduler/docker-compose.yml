# Run from the monorepo root: docker compose -f apps/yt-scheduler/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: yt, POSTGRES_PASSWORD: yt, POSTGRES_DB: yt }
    volumes: [ytdb:/var/lib/postgresql/data]
    restart: unless-stopped
  app:
    build: { context: ../.., dockerfile: apps/yt-scheduler/Dockerfile }
    env_file: .env
    environment: { DATABASE_URL: postgres://yt:yt@db:5432/yt }
    ports: ["8787:8787"]
    depends_on: [db]
    restart: unless-stopped
volumes:
  ytdb: {}
