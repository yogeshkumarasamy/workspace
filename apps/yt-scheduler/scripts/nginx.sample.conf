# YT Scheduler static host.
# Production: https://yt-scheduler.yogeshkumarasamy.in/
#
# $uri/ must be tried before /index.html. Otherwise /privacy and /terms are
# directories and nginx (or a naive SPA fallback) returns the login shell
# instead of privacy/index.html and terms/index.html.
#
#   root is the dist/ directory (index.html next to privacy/ and terms/).

server {
    listen 80;
    server_name yt-scheduler.yogeshkumarasamy.in;
    root /var/www/yt-scheduler;
    index index.html;

    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
